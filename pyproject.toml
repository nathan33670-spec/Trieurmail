[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trieurmail"
version = "0.1.0"
description = "Assistant mail local : tri de l'historique, priorisation, synthèse et brouillons de réponses avec une IA locale compatible OpenAI."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
trieurmail = "trieurmail.__main__:main"

[tool.setuptools.packages.find]
include = ["trieurmail*"]

[tool.setuptools.package-data]
trieurmail = ["web/static/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
